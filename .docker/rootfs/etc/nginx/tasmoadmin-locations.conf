# Locations of the TasmoAdmin server block. Included by nginx.conf and
# nginx-ssl.conf. This file is part of the image and is NOT persisted in /data,
# so security fixes reach existing installations on image update.
# Put customisations into /data/nginx/nginx*.conf, not here.

# Everything that is not a static asset below goes to the front controller.
# Never try_files $uri here: that would serve any existing file as is, including
# PHP sources (info.php, src/, includes/, ...), composer.json, tests/.
location / {
    rewrite ^ /index.php last;
}

# Tasmota devices download firmware from here without authentication.
location ^~ /data/firmwares/ {
    add_header Access-Control-Allow-Origin *;
}

# /data is a symlink to the persistent data directory (config, devices,
# password key, backups). Never serve anything else from it. ^~ stops the
# regex locations below from taking over.
location ^~ /data/ {
    deny all;
}

# Sessions, i18n cache and backups are written into tmp/ inside the web root.
location ^~ /tmp/ {
    deny all;
}

# The only static assets the UI requests (css/js bundles, images, web manifest).
# Translations are not static: they come from index.php (actions?i18n=1).
location ^~ /resources/ {
}

location = /robots.txt {
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_read_timeout 900;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;

    internal;
}

# Container health check. php-fpm answers the ping without starting the app,
# so a check no longer leaves a session file behind (the old check on / created
# one every 30 s, kept for the 30-day session lifetime). Container-local only;
# requests through the reverse proxy come from its address and are denied.
location = /fpm-ping {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    fastcgi_pass 127.0.0.1:9001;
    include fastcgi_params;
    fastcgi_param SCRIPT_NAME /fpm-ping;
    fastcgi_param SCRIPT_FILENAME /fpm-ping;
}

# Direct access to any other PHP file (info.php, src/*.php, ...) and to hidden
# files (.git, .dockerenv, .htaccess, ...).
location ~ \.php$ {
    deny all;
}

location ~ /\. {
    deny all;
}
