worker_processes  1;
pid /var/run/nginx.pid;
user nginx nginx;

events {
    worker_connections  1024;
}

http {
    include            mime.types;
    default_type       application/octet-stream;
    sendfile           on;
    keepalive_timeout  65;

    server {
        server_name tasmoadmin.local;
        listen 443 ssl http2 default_server;

        ssl_certificate /data/nginx/certs/tasmoadmin.crt;
        ssl_certificate_key /data/nginx/certs/tasmoadmin.key;

        ssl_protocols TLSv1.2 TLSv1.1 TLSv1;

        root /var/www/tasmoadmin/;

        fastcgi_buffer_size 512k;
        fastcgi_buffers 16 512k;


        # Security-relevant locations ship with the image and are updated with it.
        # Do not copy them into this (persisted, user-editable) file.
        include /etc/nginx/tasmoadmin-locations.conf;
    }
}
