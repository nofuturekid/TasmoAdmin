name: Fork image

# Fork-only: builds the `local` branch of nofuturekid/TasmoAdmin and pushes it to GHCR.
# Uses the same Dockerfile and build args as .docker/docker.sh (amd64 only).

on:
  push:
    branches: [local]
  workflow_dispatch: ~

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nofuturekid/tasmoadmin
  ALPINE_VERSION: "3.24" # keep in sync with ALPINE_VERSION in .docker/docker.sh

jobs:
  build-and-push:
    name: Build and push fork image
    if: github.repository == 'nofuturekid/TasmoAdmin'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute build metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.docker/Dockerfile.alpine-tmpl
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            BUILD_VERSION=local-${{ steps.meta.outputs.short_sha }}
            BUILD_FROM=amd64/alpine:${{ env.ALPINE_VERSION }}
            BUILD_ARCH=amd64
          tags: |
            ${{ env.IMAGE }}:local
            ${{ env.IMAGE }}:local-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=local-${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
